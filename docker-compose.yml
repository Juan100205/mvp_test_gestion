name: sses-piloto

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sses
      POSTGRES_USER: sses
      POSTGRES_PASSWORD: ${DB_CLAVE:?Define DB_CLAVE en .env}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sses -d sses"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${AMBIENTE:-Development}
      ConnectionStrings__Sses: Host=db;Port=5432;Database=sses;Username=sses;Password=${DB_CLAVE}
      Jwt__Clave: ${JWT_CLAVE:?Define JWT_CLAVE en .env (mínimo 32 caracteres)}
      Sses__InicializarBaseDeDatos: "true"
      # Estrategias, acompañamientos y auditoría simulados para la demostración.
      Sses__CargarDatosDemo: ${DATOS_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${PUERTO_WEB:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  datos:
